name: NodeJS with Webpack

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Ensure webpack-cli
        run: npm install -D webpack webpack-cli

      - name: Build
        run: |
          if npm pkg get scripts.build | grep -vq 'undefined'; then
            npm run build
          else
            npx webpack --mode=production
          fi
        env:
          CI: true
